name: Toggl → Jira Daily Sync

on:
  schedule:
    - cron: "0 6 * * *"    # Every day at 6:00 UTC (7:00 CET / 8:00 CEST)
  workflow_dispatch:
    inputs:
      date:
        description: "Date to sync (YYYY-MM-DD). Leave empty for yesterday."
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        env:
          TOGGL_API_TOKEN: ${{ secrets.TOGGL_API_TOKEN }}
          TOGGL_WORKSPACE_ID: ${{ secrets.TOGGL_WORKSPACE_ID }}
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SYNC_DATE: ${{ github.event.inputs.date }}
        run: python sync.py
